<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent Hub</title>
<style>
  :root{
    --bg:#0c0c0c; --bar:#1b1b1b; --line:#2b2b2b;
    --fg:#cccccc; --dim:#7a7a7a; --accent:#3fb950;
    --err:#ff7b72; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.7 "Cascadia Mono","Consolas","Courier New",monospace;padding:16px 18px}
  h1{font-size:14px;margin:0 0 2px;color:#e6e6e6;font-weight:600}
  .sub{color:var(--dim);font-size:11px;margin-bottom:14px;word-break:break-all}
  .row{margin-bottom:14px}
  label{display:block;font-size:12px;color:#bbb;margin-bottom:5px}
  .hint{color:var(--dim);font-size:11px;margin-top:4px;word-break:break-all}
  .hint b{color:var(--warn);font-weight:600}
  .hint .ok{color:var(--accent)}
  .line{display:flex;gap:8px}
  input,select{background:#161616;color:var(--fg);border:1px solid #3a3a3a;border-radius:5px;
        font:12px "Cascadia Mono","Consolas",monospace;padding:6px 8px;outline:none;min-width:0}
  input{flex:1}
  select{cursor:pointer}
  input:focus,select:focus{border-color:var(--accent)}
  button{background:#242424;color:#ddd;border:1px solid #3a3a3a;border-radius:5px;
         font:12px "Cascadia Mono","Consolas",monospace;padding:6px 12px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:#5a5a5a;background:#2c2c2c}
  button.primary{border-color:#2f7d3a;color:#b7f0c2}
  button.primary:hover{background:#1d3d24;border-color:#3fa14e}
  #foot{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  #msg{margin-top:12px;font-size:12px;white-space:pre-wrap;min-height:20px}
  .err{color:var(--err)} .good{color:var(--accent)} .note{color:var(--dim)}
</style>
</head>
<body>
  <h1 data-i18n="set.title"></h1>
  <div class="sub"><span data-i18n="set.storedAt"></span> <span id="file">…</span>　·　<span data-i18n="set.scopeNote"></span></div>

  <div class="row">
    <label data-i18n="set.nodeLabel"></label>
    <div class="line">
      <input id="nodePath">
      <button data-pick="node" data-i18n="set.choose"></button>
    </div>
    <div class="hint" id="nodeHint">—</div>
  </div>

  <div class="row">
    <label data-i18n="set.codexLabel"></label>
    <div class="line">
      <input id="codexCliPath">
      <button data-pick="codex" data-i18n="set.choose"></button>
    </div>
    <div class="hint" id="codexHint">—</div>
  </div>

  <div class="row">
    <label data-i18n="set.proxyLabel"></label>
    <input id="proxy" data-i18n-ph="set.proxyPlaceholder">
    <div class="hint" id="proxyHint">—</div>
  </div>

  <div class="row">
    <label data-i18n="set.hostPortLabel"></label>
    <input id="codexPort" style="max-width:140px">
    <div class="hint" data-i18n="set.hostPortHint"></div>
  </div>

  <div class="row">
    <label data-i18n="set.langLabel"></label>
    <select id="uiLang">
      <option value="auto" data-i18n="set.langAuto"></option>
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <div id="foot">
    <button class="primary" id="save" data-i18n="set.save"></button>
    <button id="saveRestart" data-i18n="set.saveRestart"></button>
    <button id="detect" data-i18n="set.autoFill"></button>
    <button id="close" style="margin-left:auto" data-i18n="set.close"></button>
  </div>

  <div id="msg"></div>

<script>
  const $ = function (id) { return document.getElementById(id); };
  const T = (window.i18n && window.i18n.t) ? window.i18n.t : function (k) { return k; };
  if (window.i18n) window.i18n.apply();
  document.title = T('win.settingsTitle');

  function say(text, cls) { const m = $('msg'); m.className = cls || ''; m.textContent = text; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function show(d) {
    $('file').textContent = d.file;
    $('nodePath').value = d.nodePath || '';
    $('codexCliPath').value = d.codexCliPath || '';
    $('proxy').value = d.proxy || '';
    $('codexPort').value = d.codexPort || '';
    $('uiLang').value = d.uiLang || 'auto';

    const r = d.resolved || {};
    $('nodeHint').innerHTML = r.node
      ? '<span class="ok">' + esc(T('set.inUse', { path: r.node })) + '</span>'
      : T('set.notFoundNode');
    $('codexHint').innerHTML = r.codexCli
      ? '<span class="ok">' + esc(T('set.inUse', { path: r.codexCli })) + '</span>'
      : T('set.notFoundCodex');

    if (r.proxyEnv) $('proxyHint').innerHTML = esc(T('set.proxyFromEnv', { path: r.proxyEnv }));
    else if (r.proxyNow) $('proxyHint').innerHTML = '<span class="ok">' + esc(T('set.proxyNow', { path: r.proxyNow, src: r.proxySrc || '' })) + '</span>';
    else $('proxyHint').innerHTML = esc(T('set.proxyNone'));

    if (!d.nodePath && r.nodeAuto) $('nodePath').placeholder = T('set.autoFound', { path: r.nodeAuto });
    if (!d.codexCliPath && r.codexCliAuto) $('codexCliPath').placeholder = T('set.autoFound', { path: r.codexCliAuto });
    if (!d.hasFile) say(T('set.noFileYet'), 'note');
  }

  function payload() {
    return {
      nodePath: $('nodePath').value.trim(),
      codexCliPath: $('codexCliPath').value.trim(),
      proxy: $('proxy').value.trim(),
      codexPort: $('codexPort').value.trim(),
      uiLang: $('uiLang').value,
    };
  }

  async function reload() { show(await window.cfg.get()); }

  document.querySelectorAll('[data-pick]').forEach(function (b) {
    b.addEventListener('click', async function () {
      const kind = b.getAttribute('data-pick');
      const r = await window.cfg.pick(kind);
      if (r && r.ok) {
        $(kind === 'node' ? 'nodePath' : 'codexCliPath').value = r.path;
        say(T('set.picked'), 'note');
      }
    });
  });

  $('detect').addEventListener('click', async function () {
    const r = await window.cfg.detect();
    if (r.node) $('nodePath').value = r.node;
    if (r.codexCli) $('codexCliPath').value = r.codexCli;
    const missing = [r.node ? null : 'node.exe', r.codexCli ? null : 'codex.exe'].filter(Boolean).join(' / ');
    say(missing ? T('set.detectedPartial', { missing: missing }) : T('set.detected'), 'note');
  });

  $('save').addEventListener('click', async function () {
    const r = await window.cfg.save(payload());
    if (r.ok) { say(T('set.saved', { file: r.file }), 'good'); reload(); }
    else say(T('set.saveFailed', { msg: r.error }), 'err');
  });

  $('saveRestart').addEventListener('click', async function () {
    const r = await window.cfg.save(payload());
    if (!r.ok) { say(T('set.saveFailed', { msg: r.error }), 'err'); return; }
    say(T('set.savedRestarting'), 'good');
    window.cfg.restart();
  });

  $('close').addEventListener('click', function () { window.cfg.close(); });

  reload();
</script>
</body>
</html>
